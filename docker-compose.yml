services:
  app:
    build: .
    ports:
      - "127.0.0.1:8181:8181"
    environment:
      X_CLIENT_ID: "${X_CLIENT_ID:-}"
      X_CLIENT_SECRET: "${X_CLIENT_SECRET:-}"
      APP_BASE_URL: "http://localhost:8181"
      X_CALLBACK_URL: "http://localhost:8181/api/auth/callback/x"
      TOKEN_ENCRYPTION_KEY: "${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY in .env}"
      DATA_DIR: "/app/data"
      X_API_CHARGE_USD: "${X_API_CHARGE_USD:-5}"
      X_API_USAGE_OFFSET_USD: "${X_API_USAGE_OFFSET_USD:-1.039}"
      ENABLE_EXTERNAL_TRANSLATION: "${ENABLE_EXTERNAL_TRANSLATION:-0}"
      HOSTNAME: "0.0.0.0"
      PORT: "8181"
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
    external: true
    name: x-bookmark-viewer_app-data
